[project]
name = "fabrag"
version = "0.1.0"
description = "Fully-local RAG-based AI deck builder for the Flesh and Blood TCG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "uvicorn>=0.49.0",
]

[project.scripts]
fabrag = "fabrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabrag"]
